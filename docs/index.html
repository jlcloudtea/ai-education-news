<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Curated AI and education news for MagicMirror">
  <title>AI Education News</title>
  <style>
    :root { color-scheme: light dark; --accent: #4f8cff; --muted: #718096; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 64px; }
    header { border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); margin-bottom: 24px; padding-bottom: 22px; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -.04em; line-height: 1; margin: 0 0 12px; }
    .intro, .meta { color: var(--muted); }
    .feed-link { display: inline-block; margin-top: 12px; color: var(--accent); font-weight: 650; }
    #news { list-style: none; margin: 0; padding: 0; }
    article { padding: 20px 0; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
    h2 { font-size: 1.12rem; line-height: 1.35; margin: 0 0 8px; }
    h2 a { color: inherit; text-decoration: none; }
    h2 a:hover, h2 a:focus { color: var(--accent); text-decoration: underline; }
    p { margin: 8px 0 0; }
    .error { color: #d14343; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI Education News</h1>
      <p class="intro">Curated AI and Education news for MagicMirror.</p>
      <div id="updated" class="meta">Loading latest feed…</div>
      <a class="feed-link" href="aggregated_feed.xml">RSS Feed</a>
    </header>
    <ol id="news" aria-live="polite"></ol>
  </main>
  <script>
    const news = document.querySelector("#news");
    const updated = document.querySelector("#updated");

    function text(node, selector) {
      return node.querySelector(selector)?.textContent?.trim() || "";
    }

    fetch(`aggregated_feed.xml?ts=${Date.now()}`, { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      })
      .then(xmlText => {
        const xml = new DOMParser().parseFromString(xmlText, "application/xml");
        if (xml.querySelector("parsererror")) throw new Error("Invalid RSS XML");
        const buildDate = text(xml, "lastBuildDate");
        updated.textContent = buildDate ? `Last updated: ${new Date(buildDate).toLocaleString()}` : "Latest feed";
        const items = [...xml.querySelectorAll("item")];
        if (!items.length) updated.textContent += " · No matching stories right now";

        for (const item of items) {
          const article = document.createElement("article");
          const heading = document.createElement("h2");
          const link = document.createElement("a");
          link.href = text(item, "link");
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = text(item, "title");
          heading.append(link);

          const meta = document.createElement("div");
          meta.className = "meta";
          const source = text(item, "source") || "Unknown source";
          const published = text(item, "pubDate");
          meta.textContent = published ? `${source} · ${new Date(published).toLocaleString()}` : source;

          const description = document.createElement("p");
          description.textContent = text(item, "description");
          article.append(heading, meta, description);
          const row = document.createElement("li");
          row.append(article);
          news.append(row);
        }
      })
      .catch(error => {
        updated.textContent = "Could not load the RSS feed.";
        updated.className = "error";
        console.error(error);
      });
  </script>
</body>
</html>
