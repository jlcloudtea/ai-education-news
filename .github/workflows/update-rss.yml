name: Update AI Education RSS

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rss_aggregator.py"
      - "requirements.txt"
      - "config/**"
      - "docs/index.html"
      - ".github/workflows/update-rss.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-education-rss-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sync latest main branch
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Generate RSS feed
        run: python rss_aggregator.py

      - name: Validate generated XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('docs/aggregated_feed.xml'); print('RSS XML is valid')"

      - name: Commit updated feed when changed
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- docs/aggregated_feed.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No RSS changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/aggregated_feed.xml
          git commit -m "Update aggregated RSS feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
